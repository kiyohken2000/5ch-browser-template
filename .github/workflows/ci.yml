name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure LIBCLANG_PATH for core-ai (bindgen)
        shell: pwsh
        run: |
          # windows-latest ships LLVM + CMake; we only need to expose libclang.dll to bindgen.
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enable Windows long paths (llama.cpp vulkan-shaders-gen build)
        shell: pwsh
        run: |
          # llama.cpp's vulkan-shaders-gen ExternalProject builds paths that exceed
          # MAX_PATH (260 chars); MSVC cl.exe fails with C1083 without this.
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Shorten cargo target dir (MAX_PATH workaround for cl.exe)
        shell: pwsh
        run: |
          # LongPathsEnabled is not enough — MSVC cl.exe still chokes on >260 char
          # paths under D:\a\<repo>\<repo>\target\debug\build\llama-cpp-sys-2-XXX\out\build\...
          # Putting CARGO_TARGET_DIR at C:\t cuts ~70 chars and gets cmake_install.cmake
          # under the limit.
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          echo "CARGO_TARGET_DIR=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Vulkan SDK (core-ai GGML_VULKAN backend)
        shell: pwsh
        run: |
          # Chocolatey's community feed occasionally returns 503/504. Retrying alone
          # was not enough: on 2026-08-21 the feed stayed down for the whole ~5 min
          # retry window (3x 504) and the job failed. Retry first, then fall back to
          # LunarG's official installer, which does not touch the chocolatey feed.
          $vk = $null
          for ($i = 1; $i -le 3; $i++) {
            choco install vulkan-sdk -y --no-progress
            if (Test-Path 'C:\VulkanSDK') {
              $vk = (Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
              break
            }
            Write-Host "Vulkan SDK install via chocolatey failed (attempt $i/3), retrying in 15s..."
            Start-Sleep -Seconds 15
          }
          if (-not $vk) {
            Write-Host "chocolatey feed unavailable - falling back to the LunarG installer"
            $exe = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
            Invoke-WebRequest -Uri 'https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe' -OutFile $exe
            $root = 'C:\VulkanSDK\lunarg-latest'
            & $exe --root $root --accept-licenses --default-answer --confirm-command install
            if ($LASTEXITCODE -ne 0) { throw "LunarG installer exited with $LASTEXITCODE" }
            $vk = $root
          }
          # glslc is what llama.cpp's vulkan-shaders-gen actually invokes. If it is
          # missing the SDK is only half installed, and cargo check would fail much
          # later with a far less obvious error.
          if (-not (Test-Path "$vk\Bin\glslc.exe")) { throw "Vulkan SDK install incomplete (no Bin\glslc.exe): $vk" }
          echo "VULKAN_SDK=$vk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$vk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Installed Vulkan SDK at $vk"

      - name: Install Ninja (cmake generator)
        shell: pwsh
        run: |
          # Visual Studio generator + llama-cpp-sys-2 vulkan-shaders-gen ExternalProject
          # hits a "Not a file: cmake_install.cmake" MSBuild custom-build race that
          # cargo --jobs 1 can't suppress (MSBuild parallelizes custom build steps within
          # a single project regardless of /m:1). Switching to Ninja generator sidesteps
          # the bug entirely.
          # Same chocolatey feed caveat as the Vulkan SDK step above: fall back to the
          # upstream release zip so one feed outage cannot take out the whole job.
          choco install ninja -y --no-progress
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Host "chocolatey feed unavailable - falling back to the ninja-build release zip"
            $zip = Join-Path $env:RUNNER_TEMP 'ninja-win.zip'
            $dir = 'C:\ninja'
            Invoke-WebRequest -Uri 'https://github.com/ninja-build/ninja/releases/latest/download/ninja-win.zip' -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
            if (-not (Test-Path "$dir\ninja.exe")) { throw "ninja fallback install failed" }
            echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            # The failed choco run left $LASTEXITCODE non-zero, and GitHub's pwsh
            # wrapper exits with it at the end of the step - reset it or the
            # successful fallback would still be reported as a failure.
            $global:LASTEXITCODE = 0
          }

      - name: Setup MSVC dev environment (for Ninja + cl.exe)
        # Ninja generator doesn't auto-setup INCLUDE/LIB/PATH for MSVC like the
        # Visual Studio generator does — this action runs vcvarsall and exports
        # the resulting env to subsequent steps.
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake generator
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install desktop deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: apps/desktop

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Desktop build
        run: npm run build
        working-directory: apps/desktop

      - name: Desktop smoke UI
        run: npm run test:smoke-ui
        working-directory: apps/desktop

  rust-check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # spirv-headers: llama-cpp-sys-2 0.1.154 の ggml-vulkan は
          # find_package(SPIRV-Headers CONFIG REQUIRED) を要求する (0.1.146 には無かった)。
          # libvulkan-dev / glslc には SPIRV-HeadersConfig.cmake が含まれないため別途必要。
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libclang-dev \
            cmake \
            libvulkan-dev \
            glslang-tools \
            glslc \
            spirv-headers

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        run: npm ci
        working-directory: apps/desktop

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: apps/desktop

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Cargo clippy workspace
        run: cargo clippy --workspace -- -D warnings

      - name: Cargo test workspace
        # --ignored は付けない (実サーバー接続テストは CI では実行しない)
        run: cargo test --workspace

      - name: Desktop build
        run: npm run build
        working-directory: apps/desktop

      - name: Desktop smoke UI
        run: bash scripts/run_smoke_ui.sh
        working-directory: apps/desktop

  rust-check-linux-arm64:
    # Bumped from 22.04 to 24.04 — Ubuntu 22.04 ARM doesn't have glslc and
    # LunarG's repo has no arm64 packages. 24.04 ships glslc natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # spirv-headers: llama-cpp-sys-2 0.1.154 の ggml-vulkan は
          # find_package(SPIRV-Headers CONFIG REQUIRED) を要求する (0.1.146 には無かった)。
          # libvulkan-dev / glslc には SPIRV-HeadersConfig.cmake が含まれないため別途必要。
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libclang-dev \
            cmake \
            libvulkan-dev \
            glslang-tools \
            glslc \
            spirv-headers

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop deps
        run: npm ci
        working-directory: apps/desktop

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Desktop build
        run: npm run build
        working-directory: apps/desktop

  landing-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install landing deps
        run: npm ci
        working-directory: apps/landing

      - name: Validate latest.json
        run: npm run check:latest
        working-directory: apps/landing

      - name: Landing build
        run: npm run build
        working-directory: apps/landing
